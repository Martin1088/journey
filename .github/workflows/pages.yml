name: Pages

# Builds the site (one Angular app, prerendered to static HTML), checks its
# accessibility, and publishes it to GitHub Pages. Pull requests run the
# build and the checks only. Repository settings → Pages → Source must be
# set to "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: journey-app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: journey-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint templates for accessibility
        run: npm run lint:a11y

      - name: Build site (prerendered)
        # base_path is e.g. "/journey" for a project site, "" for a custom domain;
        # base_url is the full public URL, used for canonical and hreflang links.
        run: >-
          npx ng build
          --base-href="${{ steps.pages.outputs.base_path }}/"
          --define "SITE_URL='${{ steps.pages.outputs.base_url }}/'"

      - name: Install Chromium for the accessibility check
        run: npx playwright install --with-deps chromium

      - name: Check every page with axe (WCAG 2.2 A/AA, light and dark)
        run: npm run check:a11y

      - name: Add redirects for old addresses
        run: npm run redirects

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: journey-app/dist/journey-app/browser

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
